version: '3.8'

services:
  leaf-disease-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-disease-detection
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./static/uploads:/app/static/uploads
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - leaf-disease-network

networks:
  leaf-disease-network:
    driver: bridge
